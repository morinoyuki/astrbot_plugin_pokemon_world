name: astrbot_plugin_pokemon_world
display_name: 宝可梦世界
desc: 强规则宝可梦文字冒险。内置 Gen9 全量图鉴、596 处真实地点与确定性对战引擎；主线剧情（道馆 → 击退火箭队等敌对组织 → 联盟 → 冠军）、40 处神兽定点捕获、世界大赛。战斗以仿经典对战界面图片呈现。每天凌晨 4 点由 LLM 生成世界事件、个人事件与支线委托(失败自动回退本地生成器)。
author: morinoyuki
