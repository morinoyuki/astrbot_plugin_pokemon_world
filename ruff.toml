# 项目级 ruff 配置
#
# 与 life_sim 保持一致的基础规则(E4/E7/E9/F),另外追加一批"能真正抓到 bug"
# 的规则(import 排序、现代语法、bugbear、异步、可简化写法、性能),但不启用
# 行宽/中文标点/文档字符串这类纯风格规则。
#
# 刻意忽略:
#   BLE001 / S110 / S112 —— 插件运行在不可控环境(网络、PIL、字体扫描、第三方库
#   内部),异常面不可穷举;"广泛 except Exception + 日志/降级"是刻意设计。
#   RUF001-003 —— 中文全角标点出现在字符串/注释里是有意的。

line-length = 100

[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle(不含行宽)
    "F",               # pyflakes
    "W",               # 明显的语法警告
    "I",               # import 排序
    "UP",              # 现代语法
    "B",               # bugbear
    "C4",              # 推导式
    "SIM",             # 可简化写法
    "RUF",             # ruff 专有
    "ASYNC",           # 异步正确性
    "PERF",            # 性能
    "RET",             # 返回语句
    "PIE",             # 无意义代码
]
ignore = [
    "BLE001",
    "S110",
    "S112",
    "RUF001",
    "RUF002",
    "RUF003",
]
